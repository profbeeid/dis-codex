<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Delegate-facing rules for The Disney Machine executive-table simulation.">
  <title>The Disney Machine — Delegate Rules</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #274690;
      --content-max-width: 860px;
    }
    body { color: #20242b; }
    .markdown-section { max-width: var(--content-max-width); padding: 30px 28px 80px; }
    .markdown-section h1 { font-size: 2.35rem; line-height: 1.12; }
    .markdown-section h2 { margin-top: 3rem; padding-top: .5rem; border-top: 1px solid #e7e9ee; }
    .markdown-section h3 { margin-top: 2rem; }
    .markdown-section blockquote {
      color: #25314d;
      background: #f3f6fc;
      border-left: 4px solid var(--theme-color);
      padding: .8rem 1.1rem;
      margin: 1.2rem 0;
    }
    .markdown-section table { display: block; width: 100%; overflow-x: auto; white-space: normal; }
    .markdown-section th { white-space: nowrap; }
    .markdown-section code { white-space: pre-wrap; }
    .anchor span { color: inherit; }
    @media (max-width: 600px) {
      .markdown-section { padding: 22px 18px 64px; }
      .markdown-section h1 { font-size: 1.9rem; }
      .markdown-section h2 { font-size: 1.45rem; }
    }
    @media print {
      .sidebar, .search, .github-corner { display: none !important; }
      body { font-size: 11pt; }
      .content { left: 0 !important; }
      .markdown-section { max-width: none; padding: 0; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div id="app">Loading the rules…</div>
  <script>
    window.$docsify = {
      name: 'The Disney Machine',
      homepage: 'README.md',
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      search: {
        placeholder: 'Search the rules',
        noData: 'No matching rule found',
        depth: 4
      },
      pagination: false
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
