<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A self-contained room and operator console for The Walt Disney Company.">
  <title>Disney Dais Console</title>
  <style>
    :root {
      --ink:#f9f9f9; --muted:#aebbd0; --paper:#040714; --panel:#0b1630;
      --panel-high:#101f3f; --line:rgba(249,249,249,.14); --blue:#0063e5;
      --blue-2:#08aaf4; --cyan:#67d9ff; --shadow:0 18px 50px rgba(0,0,0,.38);
    }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif;
      background:radial-gradient(circle at 76% -12%,rgba(0,99,229,.28),transparent 34rem),linear-gradient(180deg,#071126 0,var(--paper) 34rem);
    }
    button,input,textarea,select { font:inherit; }
    button {
      border:1px solid var(--line); border-radius:7px; padding:.65rem .82rem; cursor:pointer;
      color:var(--ink); background:rgba(249,249,249,.08); font-weight:750; letter-spacing:.025em;
      transition:background .16s,border-color .16s,transform .08s,box-shadow .16s;
    }
    button:hover { background:rgba(249,249,249,.14); border-color:rgba(249,249,249,.3); box-shadow:0 0 22px rgba(8,170,244,.12); }
    button:active { transform:translateY(1px); }
    button:disabled { cursor:not-allowed; opacity:.4; box-shadow:none; }
    .primary { background:var(--blue); border-color:#1680ff; color:#fff; text-transform:uppercase; }
    .primary:hover { background:#0878f0; border-color:#45a0ff; }
    .success { background:rgba(0,99,229,.18); border-color:rgba(8,170,244,.5); color:#d8f3ff; }
    .danger { background:rgba(31,61,112,.34); border-color:rgba(103,155,220,.42); color:#dae8f8; }
    input,textarea,select { width:100%; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.74); color:var(--ink); padding:.72rem .82rem; outline:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--blue-2); box-shadow:0 0 0 3px rgba(8,170,244,.13); }
    textarea { resize:vertical; line-height:1.42; }
    .shell { max-width:1560px; margin:0 auto; padding:1.15rem; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; }
    .brand { position:relative; display:flex; align-items:baseline; gap:.72rem; padding-top:.3rem; }
    .brand:before { content:""; position:absolute; left:-.15rem; top:-.25rem; width:8rem; height:1.4rem; border-top:1px solid rgba(103,217,255,.72); border-radius:50%; transform:rotate(-6deg); filter:drop-shadow(0 0 5px var(--cyan)); }
    .brand h1 { margin:0; font-size:clamp(1.5rem,3vw,2.2rem); font-weight:700; letter-spacing:-.035em; }
    .eyebrow { color:var(--cyan); font-size:.68rem; font-weight:850; letter-spacing:.16em; text-transform:uppercase; }
    .top-actions,.button-row { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
    .wall-state { color:var(--muted); font-size:.8rem; }
    .wall-state.open { color:#8fd6ff; }
    .notice { display:none; margin-bottom:1rem; padding:.8rem 1rem; border:1px solid rgba(8,170,244,.45); border-radius:8px; background:rgba(0,99,229,.14); color:#d7f4ff; }
    .notice.show { display:block; }
    .console-grid { display:grid; grid-template-columns:minmax(270px,.72fr) minmax(460px,1.3fr) minmax(390px,1fr); gap:1rem; align-items:start; }
    .column { display:grid; gap:1rem; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:linear-gradient(145deg,rgba(16,31,63,.93),rgba(7,17,38,.97)); box-shadow:var(--shadow); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:.7rem; padding:.88rem 1rem; border-bottom:1px solid var(--line); background:rgba(2,7,20,.3); }
    .panel-head h2 { margin:0; font-size:.83rem; font-weight:850; letter-spacing:.12em; text-transform:uppercase; }
    .panel-body { padding:1rem; }
    .stack { display:grid; gap:.72rem; }
    .tag { display:inline-flex; align-items:center; border:1px solid rgba(174,187,208,.3); border-radius:999px; padding:.16rem .46rem; color:#cbd5e5; font-size:.63rem; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .clock-card { border:1px solid rgba(103,217,255,.28); border-radius:11px; background:linear-gradient(135deg,rgba(0,99,229,.24),rgba(8,170,244,.05) 58%,rgba(2,7,20,.65)); padding:.92rem; }
    .clock-date { margin:.18rem 0 .3rem; font-size:1.6rem; font-weight:650; letter-spacing:-.035em; }
    .clock-status { color:var(--cyan); font-size:.79rem; font-weight:800; }
    .clock-meta { display:grid; gap:.22rem; margin-top:.55rem; color:var(--muted); font-size:.71rem; line-height:1.35; }
    .clock-actions { display:grid; margin-top:.7rem; }
    .clock-set { display:grid; grid-template-columns:1fr auto; gap:.45rem; margin-top:.55rem; }
    .dial-control { display:grid; grid-template-columns:.55rem minmax(5rem,1fr) 2.7rem 3.8rem 2.7rem; gap:.42rem; align-items:center; padding:.62rem; border:1px solid var(--line); border-radius:10px; background:rgba(2,7,20,.5); }
    .dial-control strong { font-size:.82rem; letter-spacing:.05em; }
    .dial-readout { display:grid; place-items:center; min-height:2.45rem; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.74); text-align:center; font-weight:900; }
    .dial-control button { padding:.58rem .25rem; font-size:1rem; }
    .dial-swatch { width:.55rem; height:2rem; border-radius:999px; }
    .config-grid { display:grid; grid-template-columns:1fr 1fr; gap:.62rem; }
    .field label { display:block; margin-bottom:.34rem; color:var(--muted); font-size:.7rem; font-weight:850; letter-spacing:.07em; text-transform:uppercase; }
    .help { color:var(--muted); font-size:.73rem; line-height:1.42; }
    .help code { color:var(--cyan); }
    .item-card { border:1px solid var(--line); border-radius:10px; padding:.78rem; background:rgba(2,7,20,.5); }
    .item-card.on-chart { border-color:rgba(8,170,244,.35); }
    .item-card.resolved { opacity:.63; }
    .item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; margin-bottom:.4rem; }
    .item-title { font-size:.93rem; font-weight:800; line-height:1.25; }
    .item-meta { color:#c6d1e2; font-size:.75rem; line-height:1.4; }
    .item-actions { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.62rem; }
    .item-actions button { padding:.48rem .58rem; font-size:.72rem; }
    .directive-entry { margin-top:.65rem; border-top:1px solid var(--line); padding-top:.6rem; }
    .directive-entry summary { cursor:pointer; color:#d9e7f7; font-size:.76rem; font-weight:850; }
    .directive-grid { display:grid; grid-template-columns:1fr 1fr; gap:.48rem; margin-top:.55rem; }
    .directive-grid .wide { grid-column:1/-1; }
    .check-row { display:flex; flex-wrap:wrap; align-items:center; gap:.8rem; color:var(--muted); font-size:.72rem; }
    .check-row label { display:flex; align-items:center; gap:.35rem; }
    .check-row input { width:auto; }
    .directive-history { display:grid; gap:.25rem; margin-top:.55rem; color:var(--muted); font-size:.68rem; }
    .directive-record { padding:.55rem; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.025); }
    .directive-record summary,.item-editor summary,.time-tools summary { cursor:pointer; color:#d9e7f7; font-weight:850; }
    .item-editor { margin-top:.65rem; border-top:1px solid var(--line); padding-top:.6rem; }
    .item-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; margin-top:.6rem; }
    .item-edit-grid .wide { grid-column:1/-1; }
    .item-edit-grid textarea { min-height:4.8rem; }
    .time-tools { grid-column:1/-1; padding:.55rem; border:1px solid var(--line); border-radius:8px; }
    .time-buttons,.relative-time { display:flex; flex-wrap:wrap; align-items:center; gap:.38rem; }
    .time-buttons button { padding:.42rem .55rem; }
    .relative-time { margin-top:.45rem; }
    .relative-time input { width:7rem; }
    .guard-log { margin-top:.45rem; color:var(--muted); font-size:.7rem; line-height:1.35; }
    .delete-button { border-color:rgba(239,51,64,.55); color:#ffb8be; }
    .movement-ledger { display:grid; gap:.38rem; max-height:12rem; overflow:auto; padding-right:.2rem; }
    .movement-row { display:grid; grid-template-columns:auto 1fr auto; gap:.55rem; align-items:baseline; padding:.42rem .5rem; border:1px solid var(--line); border-radius:.5rem; background:rgba(255,255,255,.025); font-size:.72rem; }
    .movement-row time,.movement-row span { color:var(--muted); }
    .time-editors { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-top:.58rem; }
    .time-editors label { color:var(--muted); font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .time-editors input { margin-top:.22rem; padding:.5rem .55rem; font-size:.7rem; }
    .empty { padding:1rem; border:1px dashed rgba(174,187,208,.25); border-radius:10px; color:var(--muted); text-align:center; font-size:.82rem; }
    .staging-table { display:grid; gap:.55rem; }
    .stage-row { display:grid; grid-template-columns:1fr auto; gap:.7rem; align-items:center; padding:.65rem; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.46); }
    .stage-row strong { display:block; font-size:.82rem; }
    .stage-row small { color:var(--muted); }
    .stage-due { width:12.5rem; }
    .error-box { display:none; margin-top:.7rem; padding:.7rem .8rem; white-space:pre-wrap; border:1px solid rgba(8,170,244,.5); border-radius:8px; background:rgba(0,49,105,.32); color:#d8efff; font-size:.79rem; }
    .error-box.show { display:block; }
    .quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:.62rem; }
    .quick-grid .wide { grid-column:1/-1; }
    .effect-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
    .dependency-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.45rem; }
    .adjacent-table { display:grid; gap:.35rem; }
    .adjacent-row { display:grid; grid-template-columns:minmax(7.5rem,.9fr) minmax(8rem,1.1fr); gap:.55rem; padding:.48rem .55rem; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.46); font-size:.72rem; line-height:1.35; }
    .adjacent-row strong { color:#dbe9f7; }
    .adjacent-row span { color:var(--muted); }
    .footer { margin-top:1rem; color:#75849d; text-align:center; font-size:.72rem; }
    details.config summary { cursor:pointer; color:#d9e7f7; font-size:.78rem; font-weight:800; }
    details.config[open] summary { margin-bottom:.75rem; }
    @media(max-width:1160px) { .console-grid { grid-template-columns:minmax(270px,.72fr) minmax(460px,1.28fr); } .input-column { grid-column:1/-1; } }
    @media(max-width:760px) { .shell{padding:.7rem}.topbar{align-items:flex-start;flex-direction:column}.console-grid{grid-template-columns:1fr}.input-column{grid-column:auto}.config-grid,.quick-grid{grid-template-columns:1fr}.quick-grid .wide{grid-column:auto} }
    body.room { width:100vw; height:100vh; overflow:hidden; font-size:17px; background:radial-gradient(circle at 78% -12%,rgba(0,99,229,.31),transparent 690px),radial-gradient(circle at 6% 32%,rgba(8,170,244,.09),transparent 540px),linear-gradient(180deg,#071126 0,#040714 68%); }
    .room-viewport { width:100vw; height:100vh; display:grid; place-items:center; overflow:hidden; }
    .room-shell { width:1920px; height:1080px; display:grid; grid-template-columns:minmax(0,1fr) var(--rail-width,25%); position:relative; overflow:hidden; transform:scale(var(--room-scale,1)); transform-origin:center; }
    .chart-side { min-width:0; position:relative; z-index:1; padding:23px 24px 22px 26px; overflow:hidden; }
    .chart-head { height:58px; display:flex; align-items:flex-end; justify-content:space-between; gap:19px; margin-bottom:11px; }
    .chart-brand { position:relative; padding-top:15px; color:var(--cyan); font-size:21px; font-weight:850; letter-spacing:.18em; text-transform:uppercase; }
    .chart-brand:before { content:""; position:absolute; left:-2px; top:-5px; width:269px; height:35px; border-top:2px solid rgba(103,217,255,.76); border-radius:50%; transform:rotate(-5deg); filter:drop-shadow(0 0 7px var(--cyan)); pointer-events:none; }
    .report-banner { display:flex; align-items:center; justify-content:space-between; height:37px; margin-bottom:7px; padding:0 15px; border:1px solid rgba(103,217,255,.38); border-radius:9px; background:linear-gradient(90deg,rgba(0,99,229,.38),rgba(8,170,244,.12),rgba(0,99,229,.38)); color:#fff; font-size:14px; font-weight:900; letter-spacing:.13em; text-transform:uppercase; box-shadow:0 0 19px rgba(8,170,244,.16); }
    .gantt-scroll { width:100%; overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain; scrollbar-width:thin; scrollbar-color:rgba(103,217,255,.5) rgba(255,255,255,.04); -webkit-overflow-scrolling:touch; }
    .gantt-scroll::-webkit-scrollbar { height:8px; }
    .gantt-scroll::-webkit-scrollbar-thumb { border-radius:999px; background:rgba(103,217,255,.46); }
    .gantt { --label-width:184px; position:relative; width:100%; min-width:0; border:1px solid var(--line); border-radius:16px; overflow:clip; background:rgba(4,10,25,.74); box-shadow:0 23px 58px rgba(0,0,0,.28); }
    .axis-row,.office-row { display:grid; grid-template-columns:var(--label-width) 1fr; }
    .axis-label,.office-label { position:sticky; left:0; z-index:6; border-right:1px solid var(--line); background:rgba(7,17,38,.98); }
    .axis-label { height:40px; border-bottom:1px solid var(--line); }
    .axis-track { position:relative; height:40px; border-bottom:1px solid var(--line); background:rgba(7,17,38,.84); overflow:hidden; }
    .axis-tick { position:absolute; top:0; bottom:0; border-left:1px solid rgba(249,249,249,.12); }
    .axis-tick span { position:absolute; top:8px; left:7px; color:#aebbd0; font-size:13px; font-weight:750; white-space:nowrap; }
    .office-label { display:flex; flex-direction:column; justify-content:center; padding:0 13px; border-bottom:1px solid rgba(249,249,249,.09); }
    .office-label strong { font-size:15px; letter-spacing:.035em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .office-label small { margin-top:2px; color:var(--muted); font-size:12px; }
    .office-name-line { display:flex; align-items:center; gap:8px; }
    .office-dot { flex:none; width:10px; height:10px; border-radius:50%; box-shadow:0 0 11px currentColor; }
    .overflow-badge { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:21px; margin-left:auto; padding:0 5px; border-radius:999px; background:rgba(249,249,249,.13); color:#fff; font-size:11px; font-weight:900; }
    .office-track { position:relative; border-bottom:1px solid rgba(249,249,249,.09); overflow:hidden; background:rgba(2,7,20,.3); }
    .office-row:nth-child(odd) .office-track { background:rgba(16,31,63,.13); }
    .office-row.group-row .office-label,.office-row.group-row .office-track { border-top:2px solid rgba(103,217,255,.28); }
    .week-grid { position:absolute; inset:0; pointer-events:none; }
    .week-line { position:absolute; top:0; bottom:0; border-left:1px solid rgba(249,249,249,.065); }
    .now-rule { position:absolute; z-index:8; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 12px rgba(103,217,255,.85); pointer-events:none; }
    .now-rule:before { content:"NOW"; position:absolute; top:3px; left:50%; transform:translateX(-50%); padding:2px 5px; border-radius:3px; background:#fff; color:#041020; font-size:10px; font-weight:950; letter-spacing:.08em; }
    .chart-now:before { display:none; }
    .gantt-bar { position:absolute; z-index:3; height:calc(var(--lane-height) - 6px); min-width:29px; display:flex; align-items:center; padding:0 9px; border-radius:6px; overflow:hidden; cursor:pointer; font-size:15px; font-weight:800; line-height:1.08; letter-spacing:-.01em; transition:filter .13s,transform .13s,opacity .13s; }
    .gantt-bar:hover { z-index:7; filter:brightness(1.18); transform:translateY(-1px); }
    .gantt-bar.lead { color:#fff; border:1px solid var(--office); background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--office) 45%,transparent) 0,color-mix(in srgb,var(--office) 45%,transparent) 7px,color-mix(in srgb,var(--office) 28%,transparent) 7px,color-mix(in srgb,var(--office) 28%,transparent) 14px); }
    .gantt-bar.resolved { color:#d8dce4; border-color:#77808f; background:#4d5562; box-shadow:none; opacity:.58; }
    .gantt-bar.defaulted { color:#fff; border-color:#6eaee8; background:#274a70; opacity:.72; }
    .gantt-bar.selected { z-index:9; outline:2px solid #fff; outline-offset:2px; filter:brightness(1.15); }
    .gantt-bar > span { min-width:0; display:grid; gap:2px; overflow:hidden; }
    .gantt-bar b,.gantt-bar small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .gantt-bar b { font:inherit; }
    .gantt-bar small { color:#d7e9f8; font-size:12px; font-weight:650; }
    .empty-chart-note { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#78879f; font-size:16px; }
    .ambition-strip { width:100%; display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-top:7px; }
    .ambition-cell { min-width:0; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:rgba(7,17,38,.8); text-align:center; }
    .ambition-cell strong { display:block; overflow:hidden; color:#dbe9f7; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .ambition-cell span { color:var(--cyan); font-size:14px; font-weight:900; }
    .rail { min-width:0; height:1080px; position:relative; z-index:2; display:flex; flex-direction:column; gap:8px; padding:15px 22px; overflow-y:auto; overscroll-behavior-y:contain; scrollbar-width:thin; scrollbar-color:rgba(103,217,255,.5) rgba(255,255,255,.04); border-left:1px solid var(--line); background:linear-gradient(180deg,rgba(9,21,47,.96),rgba(4,7,20,.98)); box-shadow:-19px 0 58px rgba(0,0,0,.22); }
    .rail-resizer { position:absolute; z-index:20; left:-7px; top:0; bottom:0; width:14px; cursor:col-resize; }
    .rail-resizer:after { content:""; position:absolute; left:50%; top:42%; width:3px; height:76px; border-radius:999px; background:rgba(103,217,255,.5); box-shadow:0 0 13px rgba(8,170,244,.32); }
    .room-clock { flex:none; padding:11px 14px 12px; border:1px solid rgba(103,217,255,.28); border-radius:12px; background:linear-gradient(135deg,rgba(0,99,229,.2),rgba(2,7,20,.55)); }
    .room-date { font-size:32px; font-weight:670; letter-spacing:-.045em; line-height:1; }
    .close-signal { margin-top:7px; color:var(--cyan); font-size:14px; font-weight:800; }
    .close-meter { height:5px; margin-top:9px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.09); }
    .close-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--cyan)); box-shadow:0 0 11px rgba(8,170,244,.4); }
    .room-dials { flex:none; display:grid; gap:3px; }
    .room-dial { padding:6px 11px 7px; border:1px solid var(--line); border-radius:10px; background:rgba(2,7,20,.5); }
    .room-dial-top { display:flex; justify-content:space-between; align-items:baseline; }
    .room-dial-name { font-size:14px; font-weight:900; letter-spacing:.13em; text-transform:uppercase; }
    .room-dial-value { font-size:24px; font-weight:700; letter-spacing:-.05em; }
    .room-meter { position:relative; height:7px; margin:2px 5px; border-radius:999px; background:#020714; }
    .room-fill { height:100%; border-radius:inherit; box-shadow:0 0 12px currentColor; transition:width .2s,background .2s; }
    .dial-knob { position:absolute; top:50%; width:16px; height:16px; transform:translate(-50%,-50%); border:2px solid rgba(255,255,255,.9); border-radius:50%; background:radial-gradient(circle at 34% 28%,#fff 0 9%,color-mix(in srgb,var(--band) 48%,white) 19%,var(--band) 58%,color-mix(in srgb,var(--band) 55%,black) 100%); box-shadow:0 0 17px var(--band),inset 0 0 5px rgba(255,255,255,.5); }
    .dial-knob:after { content:""; position:absolute; left:14%; top:13%; width:70%; height:34%; border-top:1px solid rgba(255,255,255,.9); border-radius:50%; transform:rotate(-14deg); }
    .detail-slots { min-height:0; height:626px; flex:none; display:grid; grid-template-rows:repeat(2,minmax(0,1fr)); gap:8px; }
    .detail-slot { min-height:0; overflow:auto; padding:11px; border:1px dashed rgba(103,217,255,.28); border-radius:10px; background:rgba(2,7,20,.55); }
    .detail-slot.drag-over { border-color:var(--cyan); background:rgba(0,99,229,.18); }
    .detail-slot-head { display:flex; justify-content:space-between; align-items:center; gap:5px; }
    .clear-slot { padding:1px 4px; border-radius:999px; font-size:14px; }
    .detail-pane { min-height:0; }
    .detail-empty { height:100%; display:grid; place-items:center; color:#78879f; text-align:center; font-size:16px; line-height:1.4; }
    .detail-lead { display:flex; align-items:center; gap:8px; margin-bottom:5px; color:var(--office); font-size:13px; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
    .detail-pane h1 { margin:0 0 7px; font-size:25px; line-height:1.08; letter-spacing:-.035em; }
    .detail-situation { margin:0 0 7px; color:#d6dfed; font-size:16px; line-height:1.32; }

    function routesBlock(note){const routes=String(note||'').split('|').map(route=>route.trim()).filter(Boolean);return routes.length?`<div class="detail-block"><div class="detail-label">Routes</div>${routes.map(route=>`<div class="detail-value">${escapeHtml(route)}</div>`).join('')}</div>`:'';}
    function ambitionStrip(){return`<section class="ambition-strip">${CORE_OFFICES.map(office=>{const score=state.ambitionTicks[office.key];return`<div class="ambition-cell"><strong>${escapeHtml(office.name)}</strong><span>${score.ticks}${score.stars?` · ★${score.stars}`:''}</span></div>`;}).join('')}</section>`;}
    function dialEffectChips(item){const chips=['cash','love','control'].filter(key=>item.dialEffects[key]).map(key=>{const band=dialBand(state.dials[key]);return`<span class="default-chip" style="color:${band.color}">${escapeHtml(key)} ${escapeHtml(signed(item.dialEffects[key]))}</span>`;});return chips.length?chips.join(' '):'<span class="default-chip" style="color:#aebbd0">No dial movement</span>';}
    function detailBlock(label,value){return`<div class="detail-block"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value">${escapeHtml(value)}</div></div>`;}
    function render(view){if(IS_ROOM)renderRoom();else renderControl(view);}
    function updateControlClock(){const clock=clockView(),values={'control-clock-date':clock.dateLabel,'control-clock-close':closeLabel(clock),'control-clock-state':clock.status};Object.entries(values).forEach(([id,value])=>{const element=document.getElementById(id);if(element)element.textContent=value;});}
    function openRoom(){const url=new URL(location.href);url.searchParams.set('wall','1');roomWindow=window.open(url.toString(),'disney-dais-room');if(!roomWindow)notice='Chrome blocked the room window. Allow pop-ups, then try again.';renderControl();}
    function exportJson(){const payload={version:4,exportedAt:new Date().toISOString(),state:snapshot()},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=`disney-dais-${new Date().toISOString().slice(0,10)}.json`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    async function importJson(file){try{const imported=normalizeState(JSON.parse(await file.text()));if(!confirm(`Import ${imported.items.length} accepted items and ${imported.staging.length} staged items?`))return;undoStack.push(snapshot());state=imported;persist();notice='Save imported.';render();}catch(error){notice=`Import failed: ${error.message}`;render();}}
    document.getElementById('app').addEventListener('click',event=>{
      if(IS_ROOM){
        const clear=event.target.closest('[data-clear-slot]');if(clear){roomPrefs.pins[Number(clear.dataset.clearSlot)]=null;persistRoomPrefs();renderRoom();return;}
        const bar=event.target.closest('[data-item-id]');if(!bar)return;const id=bar.dataset.itemId,existing=roomPrefs.pins.findIndex(value=>sameId(value,id));if(existing>=0)roomPrefs.pins[existing]=null;else{const emptyIndex=roomPrefs.pins.findIndex(value=>!value);roomPrefs.pins[emptyIndex>=0?emptyIndex:0]=id;}persistRoomPrefs();renderRoom();return;
      }
      const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='open-room')openRoom();else if(action==='toggle-clock')toggleClock();else if(action==='set-sim-date'){try{setManualSimDate(document.getElementById('manual-sim-date').value);notice='Simulated date re-anchored and clock resumed.';renderControl();}catch(error){notice=error.message;renderControl();}}else if(action==='undo')undo();else if(action==='export')exportJson();else if(action==='import-trigger')document.getElementById('import-file').click();else if(action==='csv-upload-trigger')document.getElementById('csv-file').click();else if(action==='nudge'){const key=button.dataset.dial,amount=Number(button.dataset.amount);commit(current=>applyEffects(current,{cash:key==='cash'?amount:0,love:key==='love'?amount:0,control:key==='control'?amount:0},`Manual ${key} correction`));}else if(action==='validate-csv')addCsvToStaging();else if(action==='stage-quick')addQuick(false);else if(action==='push-quick')addQuick(true);else if(action==='accept-staging')acceptStaging();else if(action==='reject-staging')rejectStaging();else if(action==='push')pushItem(button.dataset.id);else if(action==='save-item')saveItem(button.dataset.id);else if(action==='unpush-item')unpushItem(button.dataset.id);else if(action==='delete-item')deleteItem(button.dataset.id);else if(action==='item-nudge-time')nudgeItemTime(button.dataset.id,button.dataset.field,Number(button.dataset.minutes));else if(action==='item-relative-time'){const input=button.closest('.relative-time').querySelector('input');setItemRelativeTime(button.dataset.id,button.dataset.field,Number(input.value));}else if(action==='valid-directive')recordValidDirective(button.dataset.id);else if(action==='edit-directive')editDirective(button.dataset.directiveId);else if(action==='withdraw-directive')withdrawDirective(button.dataset.directiveId);
    });
    document.getElementById('app').addEventListener('change',event=>{
      if(IS_ROOM)return;const target=event.target,action=target.dataset.action;
      if(action==='config'){const key=target.dataset.key,value=clampInt(target.value,1,key==='laneCapPerOffice'?12:525600,state.config[key]);commit(current=>current.config[key]=value);}
      else if(target.id==='import-file'&&target.files&&target.files[0])importJson(target.files[0]);
      else if(target.id==='csv-file'&&target.files&&target.files[0])importCsvFile(target.files[0]);
    });
    document.getElementById('app').addEventListener('dragstart',event=>{if(!IS_ROOM)return;const bar=event.target.closest('[data-item-id]');if(!bar)return;draggedId=bar.dataset.itemId;if(event.dataTransfer){event.dataTransfer.effectAllowed='copy';event.dataTransfer.setData('text/plain',draggedId);}});
    document.getElementById('app').addEventListener('dragover',event=>{if(!IS_ROOM)return;const slot=event.target.closest('[data-detail-slot]');if(!slot)return;event.preventDefault();slot.classList.add('drag-over');});
    document.getElementById('app').addEventListener('dragleave',event=>{if(!IS_ROOM)return;const slot=event.target.closest('[data-detail-slot]');if(slot)slot.classList.remove('drag-over');});
    document.getElementById('app').addEventListener('drop',event=>{if(!IS_ROOM)return;const slot=event.target.closest('[data-detail-slot]');if(!slot)return;event.preventDefault();const id=draggedId||(event.dataTransfer&&event.dataTransfer.getData('text/plain'));if(!id)return;const index=Number(slot.dataset.detailSlot),other=index===0?1:0;if(sameId(roomPrefs.pins[other],id))roomPrefs.pins[other]=null;roomPrefs.pins[index]=id;draggedId=null;persistRoomPrefs();renderRoom();});
    document.getElementById('app').addEventListener('dragend',()=>{draggedId=null;document.querySelectorAll('.detail-slot.drag-over').forEach(slot=>slot.classList.remove('drag-over'));});
    document.getElementById('app').addEventListener('pointerdown',event=>{if(!IS_ROOM||!event.target.closest('[data-rail-resizer]'))return;event.preventDefault();resizingRail=true;const move=moveEvent=>{const shell=document.querySelector('.room-shell'),rect=shell&&shell.getBoundingClientRect();if(!shell||!rect.width)return;roomPrefs.railWidth=Math.min(45,Math.max(20,(rect.right-moveEvent.clientX)/rect.width*100));shell.style.setProperty('--rail-width',`${roomPrefs.railWidth}%`);};const stop=()=>{resizingRail=false;persistRoomPrefs();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop);};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop);});
    window.addEventListener('resize',()=>{if(!IS_ROOM)return;const shell=document.querySelector('.room-shell');if(shell)shell.style.setProperty('--room-scale',roomScale());});
    window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){try{state=normalizeState(JSON.parse(event.newValue));render();}catch(error){}}});
    window.addEventListener('beforeunload',()=>{if(!IS_ROOM)persist();});
    setInterval(()=>{if(IS_ROOM){if(!draggedId&&!resizingRail)renderRoom();return;}const changed=processDefaults();if(!changed)updateControlClock();const status=document.getElementById('wall-status');if(status){const open=roomWindow&&!roomWindow.closed;status.textContent=open?'Room open':'Room closed';status.classList.toggle('open',Boolean(open));}},1000);
    render();
  </script>
</body>
</html>
