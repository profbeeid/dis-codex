<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local, single-file dais console for The Disney Machine.">
  <title>Dais Console</title>
  <style>
    :root {
      --ink: #f5f1e7; --muted: #aaa79f; --paper: #171717; --panel: #22211f;
      --line: #3d3a35; --gold: #e9bd58; --gold-2: #8f6d24; --red: #ed625e;
      --green: #72c48f; --shadow: 0 12px 35px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(233, 189, 88, .08), transparent 30rem), #111;
      color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line); border-radius: 10px; background: #302e2a; color: var(--ink);
      padding: .7rem .9rem; cursor: pointer; transition: background .15s ease, border-color .15s ease, transform .08s ease;
    }
    button:hover { background: #3a3732; border-color: #5a554d; }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .primary { background: var(--gold); border-color: var(--gold); color: #17120a; font-weight: 800; }
    .primary:hover { background: #f2c96d; border-color: #f2c96d; }
    .danger { background: #4b2423; border-color: #743936; color: #ffd6d4; }
    .success { background: #1f4630; border-color: #326b49; color: #d6ffe4; }
    .quiet { background: transparent; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #121212;
      color: var(--ink); padding: .75rem .85rem; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--gold-2); box-shadow: 0 0 0 3px rgba(233, 189, 88, .09); }
    textarea { resize: vertical; line-height: 1.45; }
    .shell { max-width: 1540px; margin: 0 auto; padding: 1.2rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .brand { display: flex; align-items: baseline; gap: .75rem; }
    .brand h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.55rem, 3vw, 2.25rem); font-weight: 600; }
    .eyebrow { color: var(--gold); font-size: .73rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .55rem; }
    .wall-state { align-self: center; color: var(--muted); font-size: .82rem; }
    .wall-state.open { color: var(--green); }
    .notice { display: none; margin-bottom: 1rem; border: 1px solid #735d29; border-radius: 10px; background: #322817; padding: .8rem 1rem; color: #ffe2a3; }
    .notice.show { display: block; }
    .control-grid { display: grid; grid-template-columns: minmax(280px, .78fr) minmax(430px, 1.25fr) minmax(360px, 1fr); gap: 1rem; align-items: start; }
    .column { display: grid; gap: 1rem; }
    .panel { border: 1px solid var(--line); border-radius: 16px; background: rgba(34, 33, 31, .96); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: .7rem; padding: .85rem 1rem; border-bottom: 1px solid var(--line); background: #1d1c1a; }
    .panel-head h2 { margin: 0; font-size: .9rem; letter-spacing: .09em; text-transform: uppercase; }
    .panel-body { padding: 1rem; }
    .stack { display: grid; gap: .75rem; }
    .clock-card { border: 1px solid #5a4825; border-radius: 12px; background: linear-gradient(145deg, #292216, #191816); padding: .9rem; }
    .clock-date { margin: .15rem 0 .28rem; font-family: Georgia, "Times New Roman", serif; font-size: 1.65rem; line-height: 1.05; }
    .clock-status { color: #e1c98f; font-size: .8rem; font-weight: 800; line-height: 1.35; }
    .clock-meta { display: grid; gap: .25rem; margin-top: .65rem; color: var(--muted); font-size: .72rem; line-height: 1.35; }
    .clock-actions { display: grid; margin-top: .75rem; }
    .field label { display: block; margin-bottom: .38rem; color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .dial-control { display: grid; grid-template-columns: minmax(5rem, 1fr) 2.8rem 4.4rem 2.8rem; align-items: center; gap: .45rem; padding: .65rem; border: 1px solid var(--line); border-radius: 12px; background: #191816; }
    .dial-control strong { font-size: .85rem; letter-spacing: .06em; }
    .dial-control input { text-align: center; padding: .62rem .3rem; font-weight: 900; }
    .dial-control button { padding: .62rem .3rem; font-size: 1rem; font-weight: 900; }
    .dial-control.at-risk { border-color: #7b3633; background: #281918; }
    .undo { width: 100%; min-height: 3.3rem; font-size: 1rem; font-weight: 900; letter-spacing: .04em; }
    .queue-card { border: 1px solid var(--line); border-radius: 12px; background: #191816; padding: .85rem; }
    .queue-card.crisis { border-color: #773431; background: #271817; }
    .queue-card.resolved { opacity: .78; }
    .queue-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .52rem; }
    .queue-id { display: flex; align-items: center; gap: .5rem; font-weight: 900; }
    .tag { display: inline-flex; align-items: center; border: 1px solid #534f48; border-radius: 999px; padding: .16rem .46rem; color: #d8d4cb; font-size: .66rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
    .tag.crisis { border-color: #8b3f3a; color: #ffaaa6; }
    .tag.live { border-color: #8a6e2d; color: #f2cc78; }
    .tag.resolved { border-color: #326b49; color: #9ee0b4; }
    .queue-card h3 { margin: 0 0 .45rem; font-family: Georgia, "Times New Roman", serif; font-size: 1.07rem; line-height: 1.25; }
    .queue-card p { margin: .25rem 0; color: #d2cec5; font-size: .86rem; line-height: 1.38; }
    .queue-card p strong { color: var(--ink); }
    .queue-actions { display: flex; flex-wrap: wrap; gap: .42rem; margin-top: .7rem; }
    .queue-actions button { padding: .5rem .62rem; font-size: .76rem; }
    .outcome-grid { display: grid; gap: .48rem; margin-top: .8rem; }
    .outcome-button { display: grid; grid-template-columns: 1fr auto; gap: .75rem; text-align: left; align-items: center; width: 100%; }
    .outcome-button strong { display: block; font-size: .83rem; }
    .outcome-button small { display: block; margin-top: .18rem; color: #c9c4ba; line-height: 1.25; }
    .delta { white-space: nowrap; color: var(--gold); font-size: .75rem; font-weight: 900; }
    .empty { padding: 1.1rem; border: 1px dashed #4b4842; border-radius: 12px; color: var(--muted); text-align: center; font-size: .86rem; }
    .parse-help { color: var(--muted); font-size: .75rem; line-height: 1.45; }
    .parse-help code { color: #f4d58e; }
    .button-row { display: flex; flex-wrap: wrap; gap: .5rem; }
    .button-row button { flex: 1 1 auto; }
    .error-box { display: none; margin-top: .75rem; border: 1px solid #713532; border-radius: 10px; background: #2d1a19; color: #ffc2bf; padding: .7rem .8rem; font-size: .8rem; white-space: pre-wrap; }
    .error-box.show { display: block; }
    .footer { margin-top: 1rem; color: #77736c; text-align: center; font-size: .75rem; }
    @media (max-width: 1120px) { .control-grid { grid-template-columns: minmax(280px, .8fr) minmax(430px, 1.2fr); } .compose-column { grid-column: 1 / -1; } }
    @media (max-width: 760px) { .shell { padding: .75rem; } .topbar { align-items: flex-start; flex-direction: column; } .top-actions { justify-content: flex-start; } .control-grid { grid-template-columns: 1fr; } .compose-column { grid-column: auto; } }
  </style>
</head>
<body>
  <main id="control-app"></main>
  <script>
    'use strict';
    const STORAGE_KEY = 'disney-dais-console-v1';
    const HISTORY_KEY = 'disney-dais-console-history-v1';
    const GATE = 6, DIAL_MIN = 0, DIAL_MAX = 20, MAX_HISTORY = 40;
    const DEFAULT_SIM_START = '2026-09-01';
    const SESSION_WINDOWS = [
      { id: 1, label: 'Committee Session 1', start: Date.parse('2026-09-05T10:30:00+07:00'), end: Date.parse('2026-09-05T13:00:00+07:00') },
      { id: 2, label: 'Committee Session 2', start: Date.parse('2026-09-05T14:00:00+07:00'), end: Date.parse('2026-09-05T16:00:00+07:00') },
      { id: 3, label: 'Committee Session 3', start: Date.parse('2026-09-05T16:30:00+07:00'), end: Date.parse('2026-09-05T18:00:00+07:00') },
      { id: 4, label: 'Committee Session 4', start: Date.parse('2026-09-06T08:30:00+07:00'), end: Date.parse('2026-09-06T10:00:00+07:00') },
      { id: 5, label: 'Committee Session 5', start: Date.parse('2026-09-06T10:15:00+07:00'), end: Date.parse('2026-09-06T12:00:00+07:00') },
      { id: 6, label: 'Committee Session 6', start: Date.parse('2026-09-06T13:00:00+07:00'), end: Date.parse('2026-09-06T14:30:00+07:00') },
      { id: 7, label: 'Committee Session 7', start: Date.parse('2026-09-06T14:45:00+07:00'), end: Date.parse('2026-09-06T15:45:00+07:00') }
    ];
    const TOTAL_ACTIVE_MS = SESSION_WINDOWS.reduce((sum, session) => sum + session.end - session.start, 0);
    let wallWindow = null, takeoverTimer = null, notice = '';
    let undoStack = loadUndoStack();
    let state = loadState();

    function freshState() {
      return {
        version: 2,
        month: 1,
        dials: { cash: 12, love: 10, control: 10 },
        clock: {
          simStart: DEFAULT_SIM_START,
          paused: false,
          pauseStartedAt: null,
          pauseScheduleElapsed: 0,
          manualDelayMs: 0
        },
        items: [], takeover: null, updatedAt: new Date().toISOString()
      };
    }
    function loadState() {
      try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? normalizeState(JSON.parse(raw)) : freshState(); }
      catch (error) { notice = 'Saved state could not be read. A fresh console was opened; the damaged save was not overwritten until the next action.'; return freshState(); }
    }
    function loadUndoStack() { try { const raw = localStorage.getItem(HISTORY_KEY); return raw ? JSON.parse(raw) : []; } catch (error) { return []; } }
    function normalizeState(input) {
      const base = freshState(), candidate = input && input.state ? input.state : input;
      if (!candidate || typeof candidate !== 'object') throw new Error('Invalid state');
      base.month = clampInt(candidate.month, 1, 10, 1);
      base.dials = {
        cash: clampInt(candidate.dials && candidate.dials.cash, DIAL_MIN, DIAL_MAX, 12),
        love: clampInt(candidate.dials && candidate.dials.love, DIAL_MIN, DIAL_MAX, 10),
        control: clampInt(candidate.dials && candidate.dials.control, DIAL_MIN, DIAL_MAX, 10)
      };
      const incomingClock = candidate.clock || {};
      base.clock = {
        simStart: validDateOnly(incomingClock.simStart) ? incomingClock.simStart : DEFAULT_SIM_START,
        paused: Boolean(incomingClock.paused),
        pauseStartedAt: Number.isFinite(Number(incomingClock.pauseStartedAt)) ? Number(incomingClock.pauseStartedAt) : null,
        pauseScheduleElapsed: Math.max(0, Number(incomingClock.pauseScheduleElapsed) || 0),
        manualDelayMs: Math.max(0, Number(incomingClock.manualDelayMs) || 0)
      };
      base.items = Array.isArray(candidate.items) ? candidate.items.map(normalizeItem) : [];
      const ids = new Set();
      for (const item of base.items) {
        if (!item.id) throw new Error('An imported item has no ID.');
        if (ids.has(item.id)) throw new Error(`Duplicate imported item ID ${item.id}.`);
        if (!item.outcomes.length) throw new Error(`Imported item ${item.id} has no outcomes.`);
        ids.add(item.id);
      }
      base.takeover = candidate.takeover && Number(candidate.takeover.expiresAt) > Date.now() ? candidate.takeover : null;
      base.updatedAt = candidate.updatedAt || new Date().toISOString();
      return base;
    }
    function normalizeItem(item) {
      const statuses = ['held', 'upcoming', 'live', 'resolved'];
      const type = item.type === 'crisis' || String(item.id || '').toUpperCase().startsWith('X') ? 'crisis' : 'calendar';
      return {
        id: String(item.id || '').trim().toUpperCase(), type, month: clampInt(item.month, 1, 99, 1),
        simDate: validDateOnly(item.simDate) ? item.simDate : null,
        owner: String(item.owner || '').trim(), situation: String(item.situation || '').trim(),
        decide: String(item.decide || '').trim(), needs: String(item.needs || '').trim(), deadline: String(item.deadline || '').trim(),
        outcomes: Array.isArray(item.outcomes) ? item.outcomes.map(normalizeOutcome) : [],
        status: statuses.includes(item.status) ? item.status : (type === 'crisis' ? 'held' : 'upcoming'),
        resolution: item.resolution || null, createdAt: item.createdAt || new Date().toISOString(),
        activatedAt: item.activatedAt || null, resolvedAt: item.resolvedAt || null
      };
    }
    function normalizeOutcome(outcome) {
      return {
        label: String(outcome.label || '').trim(), consequence: String(outcome.consequence || outcome['public consequence'] || '').trim(),
        cash: clampInt(outcome.cash, -20, 20, 0), love: clampInt(outcome.love, -20, 20, 0), control: clampInt(outcome.control, -20, 20, 0)
      };
    }
    function clampInt(value, min, max, fallback) { const parsed = Number.parseInt(value, 10); return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback; }
    function validDateOnly(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }
    function dateOnlyMs(value) { return validDateOnly(value) ? Date.parse(`${value}T00:00:00Z`) : NaN; }
    function addUtcMonths(startMs, amount) {
      const source = new Date(startMs);
      const target = new Date(Date.UTC(source.getUTCFullYear(), source.getUTCMonth() + amount, 1));
      const lastDay = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
      target.setUTCDate(Math.min(source.getUTCDate(), lastDay));
      return target.getTime();
    }
    function scheduledActiveElapsed(now = Date.now()) {
      return SESSION_WINDOWS.reduce((sum, session) => {
        if (now <= session.start) return sum;
        return sum + Math.max(0, Math.min(now, session.end) - session.start);
      }, 0);
    }
    function effectiveActiveElapsed(now = Date.now()) {
      const scheduled = state.clock.paused ? state.clock.pauseScheduleElapsed : scheduledActiveElapsed(now);
      return Math.max(0, Math.min(TOTAL_ACTIVE_MS, scheduled - state.clock.manualDelayMs));
    }
    function sessionAt(now = Date.now()) { return SESSION_WINDOWS.find(session => now >= session.start && now < session.end) || null; }
    function nextSessionAfter(now = Date.now()) { return SESSION_WINDOWS.find(session => session.start > now) || null; }
    function formatWib(timestamp, includeDate = true) {
      const options = includeDate
        ? { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta', timeZoneName: 'short' }
        : { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta', timeZoneName: 'short' };
      return new Intl.DateTimeFormat('en-GB', options).format(new Date(timestamp));
    }
    function formatDuration(milliseconds) {
      const totalMinutes = Math.max(0, Math.ceil(milliseconds / 60000));
      const hours = Math.floor(totalMinutes / 60), minutes = totalMinutes % 60;
      return hours ? `${hours}h ${minutes}m` : `${minutes}m`;
    }
    function clockView(now = Date.now()) {
      const elapsed = effectiveActiveElapsed(now);
      const ratio = TOTAL_ACTIVE_MS ? elapsed / TOTAL_ACTIVE_MS : 0;
      const startMs = dateOnlyMs(state.clock.simStart);
      const simulatedMonths = elapsed / 3600000;
      const fullMonths = Math.floor(simulatedMonths);
      const monthFraction = simulatedMonths - fullMonths;
      const monthStartMs = addUtcMonths(startMs, fullMonths);
      const nextMonthMs = addUtcMonths(startMs, fullMonths + 1);
      const simMs = monthStartMs + (nextMonthMs - monthStartMs) * monthFraction;
      const simDate = new Date(simMs);
      const simDateKey = [simDate.getUTCFullYear(), String(simDate.getUTCMonth() + 1).padStart(2, '0'), String(simDate.getUTCDate()).padStart(2, '0')].join('-');
      const simDateLabel = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(simDate);
      const monthNumber = fullMonths + 1;
      const monthTotal = Math.ceil(TOTAL_ACTIVE_MS / 3600000);
      const activeSession = sessionAt(now), nextSession = nextSessionAfter(now);
      let status, nextLabel;
      if (state.clock.paused) {
        status = 'Manually paused';
        nextLabel = 'Resume continues from this simulated date without jumping.';
      } else if (activeSession) {
        status = `${activeSession.label} · running`;
        nextLabel = `Automatic break in ${formatDuration(activeSession.end - now)} at ${formatWib(activeSession.end)}.`;
      } else if (now < SESSION_WINDOWS[0].start) {
        status = 'Waiting for Committee Session 1';
        nextLabel = `Starts automatically ${formatWib(SESSION_WINDOWS[0].start)}.`;
      } else if (nextSession) {
        status = 'Scheduled break · clock frozen';
        nextLabel = `Resumes automatically ${formatWib(nextSession.start)}.`;
      } else if (elapsed >= TOTAL_ACTIVE_MS) {
        status = 'Simulation complete';
        nextLabel = 'The final committee window has ended.';
      } else {
        status = 'Conference schedule ended · clock frozen';
        nextLabel = 'Manual pauses left the simulation short of the full 11h 45m trajectory.';
      }
      return { elapsed, ratio, simulatedMonths, simMs, simDateKey, simDateLabel, monthNumber, monthTotal, status, nextLabel, activeSession };
    }
    function snapshot() { const copy = structuredClone(state); copy.takeover = null; return copy; }
    function commit(mutator, options = {}) {
      if (options.record !== false) { undoStack.push(snapshot()); if (undoStack.length > MAX_HISTORY) undoStack.shift(); }
      mutator(state); state.updatedAt = new Date().toISOString(); persist(); renderAll();
    }
    function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(HISTORY_KEY, JSON.stringify(undoStack)); }
    function undo() { if (!undoStack.length) return; state = normalizeState(undoStack.pop()); state.takeover = null; persist(); renderAll(); }
    function escapeHtml(value) { return String(value == null ? '' : value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
    function signed(value) { const number = Number(value) || 0; return number > 0 ? `+${number}` : String(number); }
    function deltaSummary(outcome, long = false) {
      const parts = [];
      if (outcome.cash) parts.push(`${long ? 'Cash ' : 'C '}${signed(outcome.cash)}`);
      if (outcome.love) parts.push(`${long ? 'Love ' : 'L '}${signed(outcome.love)}`);
      if (outcome.control) parts.push(`${long ? 'Control ' : 'K '}${signed(outcome.control)}`);
      return parts.length ? parts.join(' · ') : 'No dial movement';
    }
    function formatDateKey(value) {
      if (!validDateOnly(value)) return '';
      return new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }).format(new Date(dateOnlyMs(value)));
    }
    function getItems(status) {
      return state.items.filter(item => item.status === status).sort((a, b) => {
        if (a.simDate && b.simDate) return a.simDate.localeCompare(b.simDate) || a.id.localeCompare(b.id);
        if (a.simDate) return -1;
        if (b.simDate) return 1;
        return a.month - b.month || a.id.localeCompare(b.id);
      });
    }
    function findItem(id) { return state.items.find(item => item.id === id); }

    function renderControl() {
      const root = document.getElementById('control-app');
      const held = getItems('held'), upcoming = getItems('upcoming'), live = getItems('live');
      const resolved = getItems('resolved').sort((a, b) => String(b.resolvedAt).localeCompare(String(a.resolvedAt))).slice(0, 12);
      const clock = clockView();
      root.innerHTML = `
        <div class="shell">
          <header class="topbar">
            <div class="brand"><span class="eyebrow">The Disney Machine</span><h1>Dais Console</h1></div>
            <div class="top-actions">
              <span id="wall-status" class="wall-state ${wallWindow && !wallWindow.closed ? 'open' : ''}">${wallWindow && !wallWindow.closed ? 'Wall open' : 'Wall closed'}</span>
              <button data-action="open-wall" class="primary">Open wall</button>
              <button data-action="export">Export JSON</button>
              <button data-action="import-trigger">Import JSON</button>
              <input id="import-file" type="file" accept="application/json,.json" hidden>
            </div>
          </header>
          <div class="notice ${notice ? 'show' : ''}">${escapeHtml(notice)}</div>
          <section class="control-grid">
            <div class="column">
              <section class="panel"><div class="panel-head"><h2>Simulation clock</h2><span class="tag">1 real hour = 1 month</span></div><div class="panel-body stack">
                <div class="clock-card">
                  <div class="eyebrow">Simulated date · Month <span id="control-sim-month">${clock.monthNumber}</span> of ${clock.monthTotal}</div>
                  <div id="control-sim-date" class="clock-date">${escapeHtml(clock.simDateLabel)}</div>
                  <div id="control-clock-status" class="clock-status">${escapeHtml(clock.status)}</div>
                  <div class="clock-meta">
                    <span id="control-real-time">System clock: ${escapeHtml(formatWib(Date.now(), false))}</span>
                    <span id="control-next-time">${escapeHtml(clock.nextLabel)}</span>
                  </div>
                  <div class="clock-actions"><button id="clock-toggle" data-action="toggle-clock" class="${state.clock.paused ? 'success' : 'danger'}">${state.clock.paused ? 'RESUME CLOCK' : 'PAUSE CLOCK'}</button></div>
                </div>
                <div class="field"><label for="sim-start-input">Simulated start date</label><input id="sim-start-input" data-action="set-sim-start" type="date" value="${escapeHtml(state.clock.simStart)}"></div>
                <div class="parse-help">The clock runs only inside the seven Secretariat committee windows in WIB. Coffee, lunch, overnight, and free time freeze automatically. Manual Pause excludes only active committee minutes, so Resume never jumps forward.</div>
              </div></section>
              <section class="panel"><div class="panel-head"><h2>Dials</h2><span class="tag">Gate ${GATE}</span></div><div class="panel-body stack">
                ${dialControl('cash', 'Cash')}${dialControl('love', 'Love')}${dialControl('control', 'Control')}
                <button data-action="undo" class="undo danger" ${undoStack.length ? '' : 'disabled'}>UNDO LAST ACTION</button>
                <div class="parse-help">${undoStack.length} reversible action${undoStack.length === 1 ? '' : 's'} available. Manual dial changes are the escape hatch for discounts, corrections, and unsettled rules.</div>

    function renderAll() { renderControl(); renderWall(); }

    function parseSimDateText(input) {
      const value = String(input || '').trim();
      if (validDateOnly(value)) return value;
      let match = value.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
      let day, month, year;
      if (match) {
        day = Number(match[1]); month = Number(match[2]); year = Number(match[3]);
      } else {
        match = value.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
        if (!match) return null;
        const months = { january:1, jan:1, february:2, feb:2, march:3, mar:3, april:4, apr:4, may:5, june:6, jun:6, july:7, jul:7, august:8, aug:8, september:9, sep:9, sept:9, october:10, oct:10, november:11, nov:11, december:12, dec:12 };
        day = Number(match[1]); month = months[match[2].toLowerCase()]; year = Number(match[3]);

      const iso = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

    }
    function monthNumberForDate(simDate) {
      if (!validDateOnly(simDate)) return 1;
      const start = new Date(dateOnlyMs(state.clock.simStart)), due = new Date(dateOnlyMs(simDate));
      return Math.max(1, (due.getUTCFullYear() - start.getUTCFullYear()) * 12 + due.getUTCMonth() - start.getUTCMonth() + 1);
    }
    function parseItemLine(line, forcedStatus) {
      const parts = line.split('|').map(part => part.trim()).filter(Boolean);
      if (parts.length < 4) throw new Error('Expected at least ID | simulated date | situation | one outcome.');
      const id = parts[0].toUpperCase();
      if (!/^[A-Z][A-Z0-9_-]*$/.test(id)) throw new Error(`Invalid item ID "${parts[0]}".`);
      const monthMatch = parts[1].match(/^M(?:ONTH\s*)?(\d{1,2})$/i);
      const simDate = monthMatch ? null : parseSimDateText(parts[1]);
      if (!monthMatch && !simDate) throw new Error(`Invalid simulated date "${parts[1]}". Use 15 December 2026, 15/12/2026, or legacy M4.`);
      const item = {
        id, type: id.startsWith('X') ? 'crisis' : 'calendar',
        month: monthMatch ? clampInt(monthMatch[1], 1, 99, 1) : monthNumberForDate(simDate), simDate,
        owner: '', situation: stripField(parts[2], 'SITUATION'), decide: '', needs: '', deadline: '', outcomes: [],
        status: forcedStatus || (id.startsWith('X') ? 'held' : 'upcoming'), resolution: null, createdAt: new Date().toISOString(), resolvedAt: null
      };
      for (const segment of parts.slice(3)) {
        if (/^OWNER\b/i.test(segment)) item.owner = stripField(segment, 'OWNER');
        else if (/^DECIDE\b/i.test(segment)) item.decide = stripField(segment, 'DECIDE');
        else if (/^NEEDS\b/i.test(segment)) item.needs = stripField(segment, 'NEEDS');
        else if (/^DEADLINE\b/i.test(segment)) item.deadline = stripField(segment, 'DEADLINE');
        else item.outcomes.push(parseOutcome(segment));
      }
      if (!item.situation) throw new Error(`${id}: situation is empty.`);
      if (!item.outcomes.length) throw new Error(`${id}: add at least one outcome ending in Cash/Love/Control, such as -1/0/0.`);
      return normalizeItem(item);
    }
    function stripField(segment, key) { return segment.replace(new RegExp(`^${key}\\s*:?\\s*`, 'i'), '').trim(); }
    function parseOutcome(segment) {
      const deltaMatch = segment.match(/,?\s*([+-]?\d+)\s*\/\s*([+-]?\d+)\s*\/\s*([+-]?\d+)\s*$/);
      if (!deltaMatch) throw new Error(`Outcome "${segment}" must end with Cash/Love/Control, for example -1/0/0.`);
      const head = segment.slice(0, deltaMatch.index).replace(/,\s*$/, '').trim();
      let label = '', consequence = '';
      const firstComma = head.indexOf(',');
      if (firstComma >= 0) { label = head.slice(0, firstComma).trim(); consequence = head.slice(firstComma + 1).trim(); }
      else if (/^DEFAULT\b/i.test(head)) { label = 'DEFAULT'; consequence = head.replace(/^DEFAULT\s*/i, '').trim(); }
      else { const words = head.split(/\s+/); label = words.shift() || 'OUTCOME'; consequence = words.join(' '); }
      return normalizeOutcome({ label, consequence: consequence || label, cash: deltaMatch[1], love: deltaMatch[2], control: deltaMatch[3] });
    }
    function parseLines(text, forcedStatus, batchDefaults = false) {
      const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean), items = [], errors = [];
      const seen = new Set(state.items.map(item => item.id));
      lines.forEach((line, index) => {
        try {
          const item = parseItemLine(line, batchDefaults ? undefined : forcedStatus);
          if (seen.has(item.id)) throw new Error(`Duplicate ID ${item.id}.`);
          if (items.some(existing => existing.id === item.id)) throw new Error(`Duplicate ID ${item.id} in this paste.`);
          items.push(item);

    }
    function serializeItem(item) {

        ? new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(dateOnlyMs(item.simDate)))
        : `M${item.month}`;
      const fields = [item.id, due, item.situation, item.owner ? `OWNER ${item.owner}` : '', item.decide ? `DECIDE ${item.decide}` : '', item.needs ? `NEEDS ${item.needs}` : '', item.deadline ? `DEADLINE ${item.deadline}` : '', ...item.outcomes.map(outcome => `${outcome.label}, ${outcome.consequence}, ${outcome.cash}/${outcome.love}/${outcome.control}`)];
      return fields.filter(Boolean).join(' | ');
    }
    function showErrors(errorId, errors) { const box = document.getElementById(errorId); if (!box) return; box.textContent = errors.join('\n'); box.classList.toggle('show', Boolean(errors.length)); }
    function addParsedItems(text, forcedStatus, batchDefaults, errorId, inputId) {
      const result = parseLines(text, forcedStatus, batchDefaults);
      if (result.errors.length || !result.items.length) { showErrors(errorId, result.errors.length ? result.errors : ['Nothing to add.']); return; }
      commit(current => { current.items.push(...result.items); });
      const input = document.getElementById(inputId); if (input) input.value = '';
      notice = `${result.items.length} item${result.items.length === 1 ? '' : 's'} added.`; renderAll();
    }
    function toggleClock(now = Date.now()) {
      commit(current => {
        if (!current.clock.paused) {
          current.clock.paused = true;
          current.clock.pauseStartedAt = now;
          current.clock.pauseScheduleElapsed = scheduledActiveElapsed(now);
        } else {
          const newlyPausedActiveMs = Math.max(0, scheduledActiveElapsed(now) - current.clock.pauseScheduleElapsed);
          current.clock.manualDelayMs += newlyPausedActiveMs;
          current.clock.paused = false;
          current.clock.pauseStartedAt = null;
          current.clock.pauseScheduleElapsed = 0;
        }
      });
    }
    function clearTakeoverAfterDelay() {
      clearTimeout(takeoverTimer);
      takeoverTimer = setTimeout(() => { state.takeover = null; persist(); renderWall(); }, 5050);
    }
    function autoActivateDueItems(now = Date.now()) {
      if (state.clock.paused || now < SESSION_WINDOWS[0].start) return false;
      const currentDate = clockView(now).simDateKey;
      const due = state.items.filter(item => (item.status === 'held' || item.status === 'upcoming') && item.simDate && item.simDate <= currentDate);
      if (!due.length) return false;
      due.forEach(item => { item.status = 'live'; item.activatedAt = new Date(now).toISOString(); });
      const crisis = due.find(item => item.type === 'crisis');
      if (crisis && !(state.takeover && state.takeover.expiresAt > now)) {
        state.takeover = {
          kind: 'activation', id: crisis.id, label: 'CRISIS NOW LIVE', consequence: crisis.situation,
          delta: formatDateKey(crisis.simDate), expiresAt: now + 5000
        };
        clearTakeoverAfterDelay();
      }
      state.updatedAt = new Date(now).toISOString();
      persist(); renderAll();
      return true;
    }
    function updateClockDisplays(now = Date.now()) {
      const clock = clockView(now);
      const values = {
        'control-sim-date': clock.simDateLabel,
        'control-sim-month': clock.monthNumber,
        'control-clock-status': clock.status,
        'control-real-time': `System clock: ${formatWib(now, false)}`,
        'control-next-time': clock.nextLabel
      };
      Object.entries(values).forEach(([id, value]) => { const element = document.getElementById(id); if (element) element.textContent = value; });
      const toggle = document.getElementById('clock-toggle');
      if (toggle) {
        toggle.textContent = state.clock.paused ? 'RESUME CLOCK' : 'PAUSE CLOCK';
        toggle.classList.toggle('success', state.clock.paused);
        toggle.classList.toggle('danger', !state.clock.paused);
      }
    }
    function clockTick(now = Date.now()) {
      const activated = autoActivateDueItems(now);
      if (!activated) updateClockDisplays(now);
      renderWall();
      const status = document.getElementById('wall-status');
      if (status) {
        const open = wallWindow && !wallWindow.closed;
        status.textContent = open ? 'Wall open' : 'Wall closed';
        status.classList.toggle('open', Boolean(open));
      }
    }
    function resolveItem(id, outcomeIndex) {
      const item = findItem(id); if (!item || item.status !== 'live') return;
      const outcome = item.outcomes[outcomeIndex]; if (!outcome) return;
      if (!window.confirm(`Resolve ${item.id} as "${outcome.label}"?\n\n${outcome.consequence}\n${deltaSummary(outcome, true)}`)) return;
      commit(current => {
        const target = current.items.find(entry => entry.id === id);
        current.dials.cash = clampInt(current.dials.cash + outcome.cash, DIAL_MIN, DIAL_MAX, current.dials.cash);
        current.dials.love = clampInt(current.dials.love + outcome.love, DIAL_MIN, DIAL_MAX, current.dials.love);
        current.dials.control = clampInt(current.dials.control + outcome.control, DIAL_MIN, DIAL_MAX, current.dials.control);
        target.status = 'resolved'; target.resolution = structuredClone(outcome); target.resolvedAt = new Date().toISOString();
        current.takeover = { kind: 'resolution', id: target.id, label: outcome.label, consequence: outcome.consequence, delta: deltaSummary(outcome, true), expiresAt: Date.now() + 5000 };
      });
      clearTakeoverAfterDelay();
    }
    function exportJson() {
      const payload = { version: 2, exportedAt: new Date().toISOString(), state: snapshot() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), url = URL.createObjectURL(blob), anchor = document.createElement('a');
      anchor.href = url; anchor.download = `dais-console-${clockView().simDateKey}-${new Date().toISOString().slice(0, 10)}.json`; anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    async function importJson(file) {
      try {
        const imported = normalizeState(JSON.parse(await file.text()));
        if (!window.confirm(`Import this save?\n\nSimulated start ${formatDateKey(imported.clock.simStart)}; ${imported.items.length} items. The current state can still be restored with Undo.`)) return;
        undoStack.push(snapshot()); if (undoStack.length > MAX_HISTORY) undoStack.shift(); state = imported; state.takeover = null;
        notice = `Imported ${imported.items.length} items.`; persist(); renderAll();
      } catch (error) { notice = `Import failed: ${error.message}`; renderControl(); }
    }

    document.getElementById('control-app').addEventListener('click', event => {
      const button = event.target.closest('[data-action]'); if (!button) return;
      const action = button.dataset.action;
      if (action === 'open-wall') openWall();
      else if (action === 'toggle-clock') toggleClock();
      else if (action === 'undo') undo();
      else if (action === 'export') exportJson();
      else if (action === 'import-trigger') document.getElementById('import-file').click();
      else if (action === 'nudge-dial') { const key = button.dataset.dial, amount = Number(button.dataset.amount); commit(current => { current.dials[key] = clampInt(current.dials[key] + amount, DIAL_MIN, DIAL_MAX, current.dials[key]); }); }
      else if (action === 'go-live') commit(current => { const item = current.items.find(entry => entry.id === button.dataset.id); if (item) item.status = 'live'; });
      else if (action === 'resolve') resolveItem(button.dataset.id, Number(button.dataset.outcome));
      else if (action === 'duplicate') { const item = findItem(button.dataset.id); if (!item) return; const input = document.getElementById('compose-input'); input.value = serializeItem(item); input.focus(); input.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      else if (action === 'delete') { const item = findItem(button.dataset.id); if (item && window.confirm(`Delete ${item.id}?`)) commit(current => { current.items = current.items.filter(entry => entry.id !== item.id); }); }
      else if (action === 'add-compose') addParsedItems(document.getElementById('compose-input').value, button.dataset.status, false, 'compose-errors', 'compose-input');
      else if (action === 'add-bulk') addParsedItems(document.getElementById('bulk-input').value, undefined, true, 'bulk-errors', 'bulk-input');
    });
    document.getElementById('control-app').addEventListener('change', event => {
      const target = event.target, action = target.dataset.action;
      if (action === 'set-sim-start') {
        if (!validDateOnly(target.value)) { notice = 'Choose a valid simulated start date.'; renderControl(); return; }
        if (target.value !== state.clock.simStart) commit(current => {
          current.clock.simStart = target.value;
          current.items.forEach(item => { if (item.simDate) item.month = monthNumberForDate(item.simDate); });
        });
      }
      else if (action === 'edit-dial') { const key = target.dataset.dial, value = clampInt(target.value, DIAL_MIN, DIAL_MAX, state.dials[key]); if (value !== state.dials[key]) commit(current => { current.dials[key] = value; }); }
      else if (target.id === 'import-file' && target.files && target.files[0]) importJson(target.files[0]);
    });
    window.addEventListener('beforeunload', persist);
    setInterval(clockTick, 1000);
    if (state.takeover && state.takeover.expiresAt > Date.now()) takeoverTimer = setTimeout(() => { state.takeover = null; persist(); renderWall(); }, state.takeover.expiresAt - Date.now());
    renderControl();
    clockTick();
  </script>
</body>
</html>
