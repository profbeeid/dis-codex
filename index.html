<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A self-contained room and operator console for The Disney Machine.">
  <title>Disney Dais Console</title>
  <style>
    :root {
      --ink:#f9f9f9; --muted:#aebbd0; --paper:#040714; --panel:#0b1630;
      --panel-high:#101f3f; --line:rgba(249,249,249,.14); --blue:#0063e5;
      --blue-2:#08aaf4; --cyan:#67d9ff; --red:#ef3340; --orange:#f28c28;
      --yellow:#f2cf3a; --green:#35b86b; --danger:#ff536a; --shadow:0 18px 50px rgba(0,0,0,.38);
    }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif;
      background:radial-gradient(circle at 76% -12%,rgba(0,99,229,.28),transparent 34rem),linear-gradient(180deg,#071126 0,var(--paper) 34rem);
    }
    button,input,textarea,select { font:inherit; }
    button {
      border:1px solid var(--line); border-radius:7px; padding:.65rem .82rem; cursor:pointer;
      color:var(--ink); background:rgba(249,249,249,.08); font-weight:750; letter-spacing:.025em;
      transition:background .16s,border-color .16s,transform .08s,box-shadow .16s;
    }
    button:hover { background:rgba(249,249,249,.14); border-color:rgba(249,249,249,.3); box-shadow:0 0 22px rgba(8,170,244,.12); }
    button:active { transform:translateY(1px); }
    button:disabled { cursor:not-allowed; opacity:.4; box-shadow:none; }
    .primary { background:var(--blue); border-color:#1680ff; color:#fff; text-transform:uppercase; }
    .primary:hover { background:#0878f0; border-color:#45a0ff; }
    .success { background:rgba(53,184,107,.15); border-color:rgba(53,184,107,.5); color:#caffdc; }
    .danger { background:rgba(255,83,106,.13); border-color:rgba(255,83,106,.45); color:#ffdce1; }
    input,textarea,select { width:100%; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.74); color:var(--ink); padding:.72rem .82rem; outline:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--blue-2); box-shadow:0 0 0 3px rgba(8,170,244,.13); }
    textarea { resize:vertical; line-height:1.42; }
    .shell { max-width:1560px; margin:0 auto; padding:1.15rem; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; }
    .brand { position:relative; display:flex; align-items:baseline; gap:.72rem; padding-top:.3rem; }
    .brand:before { content:""; position:absolute; left:-.15rem; top:-.25rem; width:8rem; height:1.4rem; border-top:1px solid rgba(103,217,255,.72); border-radius:50%; transform:rotate(-6deg); filter:drop-shadow(0 0 5px var(--cyan)); }
    .brand h1 { margin:0; font-size:clamp(1.5rem,3vw,2.2rem); font-weight:700; letter-spacing:-.035em; }
    .eyebrow { color:var(--cyan); font-size:.68rem; font-weight:850; letter-spacing:.16em; text-transform:uppercase; }
    .top-actions,.button-row { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
    .wall-state { color:var(--muted); font-size:.8rem; }
    .wall-state.open { color:#8ce7b3; }
    .notice { display:none; margin-bottom:1rem; padding:.8rem 1rem; border:1px solid rgba(8,170,244,.45); border-radius:8px; background:rgba(0,99,229,.14); color:#d7f4ff; }
    .notice.show { display:block; }
    .console-grid { display:grid; grid-template-columns:minmax(270px,.72fr) minmax(460px,1.3fr) minmax(390px,1fr); gap:1rem; align-items:start; }
    .column { display:grid; gap:1rem; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:linear-gradient(145deg,rgba(16,31,63,.93),rgba(7,17,38,.97)); box-shadow:var(--shadow); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:.7rem; padding:.88rem 1rem; border-bottom:1px solid var(--line); background:rgba(2,7,20,.3); }
    .panel-head h2 { margin:0; font-size:.83rem; font-weight:850; letter-spacing:.12em; text-transform:uppercase; }
    .panel-body { padding:1rem; }
    .stack { display:grid; gap:.72rem; }
    .tag { display:inline-flex; align-items:center; border:1px solid rgba(174,187,208,.3); border-radius:999px; padding:.16rem .46rem; color:#cbd5e5; font-size:.63rem; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .clock-card { border:1px solid rgba(103,217,255,.28); border-radius:11px; background:linear-gradient(135deg,rgba(0,99,229,.24),rgba(8,170,244,.05) 58%,rgba(2,7,20,.65)); padding:.92rem; }
    .clock-date { margin:.18rem 0 .3rem; font-size:1.6rem; font-weight:650; letter-spacing:-.035em; }
    .clock-status { color:var(--cyan); font-size:.79rem; font-weight:800; }
    .clock-meta { display:grid; gap:.22rem; margin-top:.55rem; color:var(--muted); font-size:.71rem; line-height:1.35; }
    .clock-actions { display:grid; margin-top:.7rem; }
    .dial-control { display:grid; grid-template-columns:.55rem minmax(5rem,1fr) 2.7rem 3.8rem 2.7rem; gap:.42rem; align-items:center; padding:.62rem; border:1px solid var(--line); border-radius:10px; background:rgba(2,7,20,.5); }
    .dial-control strong { font-size:.82rem; letter-spacing:.05em; }
    .dial-readout { display:grid; place-items:center; min-height:2.45rem; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.74); text-align:center; font-weight:900; }
    .dial-control button { padding:.58rem .25rem; font-size:1rem; }
    .dial-swatch { width:.55rem; height:2rem; border-radius:999px; }
    .config-grid { display:grid; grid-template-columns:1fr 1fr; gap:.62rem; }
    .field label { display:block; margin-bottom:.34rem; color:var(--muted); font-size:.7rem; font-weight:850; letter-spacing:.07em; text-transform:uppercase; }
    .help { color:var(--muted); font-size:.73rem; line-height:1.42; }
    .help code { color:var(--cyan); }
    .item-card { border:1px solid var(--line); border-radius:10px; padding:.78rem; background:rgba(2,7,20,.5); }
    .item-card.on-chart { border-color:rgba(8,170,244,.35); }
    .item-card.resolved { opacity:.63; }
    .item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; margin-bottom:.4rem; }
    .item-title { font-size:.93rem; font-weight:800; line-height:1.25; }
    .item-meta { color:#c6d1e2; font-size:.75rem; line-height:1.4; }
    .item-actions { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.62rem; }
    .item-actions button { padding:.48rem .58rem; font-size:.72rem; }
    .empty { padding:1rem; border:1px dashed rgba(174,187,208,.25); border-radius:10px; color:var(--muted); text-align:center; font-size:.82rem; }
    .staging-table { display:grid; gap:.55rem; }
    .stage-row { display:grid; grid-template-columns:1fr auto; gap:.7rem; align-items:center; padding:.65rem; border:1px solid var(--line); border-radius:8px; background:rgba(2,7,20,.46); }
    .stage-row strong { display:block; font-size:.82rem; }
    .stage-row small { color:var(--muted); }
    .stage-due { width:12.5rem; }
    .error-box { display:none; margin-top:.7rem; padding:.7rem .8rem; white-space:pre-wrap; border:1px solid rgba(255,83,106,.5); border-radius:8px; background:rgba(87,15,34,.32); color:#ffcbd2; font-size:.79rem; }
    .error-box.show { display:block; }
    .quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:.62rem; }
    .quick-grid .wide { grid-column:1/-1; }
    .effect-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
    .footer { margin-top:1rem; color:#75849d; text-align:center; font-size:.72rem; }
    details.config summary { cursor:pointer; color:#d9e7f7; font-size:.78rem; font-weight:800; }
    details.config[open] summary { margin-bottom:.75rem; }
    @media(max-width:1160px) { .console-grid { grid-template-columns:minmax(270px,.72fr) minmax(460px,1.28fr); } .input-column { grid-column:1/-1; } }
    @media(max-width:760px) { .shell{padding:.7rem}.topbar{align-items:flex-start;flex-direction:column}.console-grid{grid-template-columns:1fr}.input-column{grid-column:auto}.config-grid,.quick-grid{grid-template-columns:1fr}.quick-grid .wide{grid-column:auto} }
    body.room { overflow:hidden; background:radial-gradient(circle at 78% -12%,rgba(0,99,229,.31),transparent 36vw),radial-gradient(circle at 6% 32%,rgba(8,170,244,.09),transparent 28vw),linear-gradient(180deg,#071126 0,#040714 68%); }
    #room-app { min-height:100vh; }
    .room-shell { min-height:100vh; display:grid; grid-template-columns:3fr 1fr; position:relative; }
    .room-shell:before { content:""; position:fixed; z-index:0; left:20vw; top:-8vw; width:58vw; height:15vw; border-top:.11vw solid rgba(103,217,255,.54); border-radius:50%; transform:rotate(-4deg); filter:drop-shadow(0 0 .42vw var(--cyan)); pointer-events:none; }
    .chart-side { min-width:0; position:relative; z-index:1; padding:2.1vh 1.25vw 2vh 1.35vw; }
    .chart-head { height:5.4vh; display:flex; align-items:flex-end; justify-content:space-between; gap:1vw; margin-bottom:1vh; }
    .chart-brand { font-size:1vw; font-weight:850; letter-spacing:.18em; text-transform:uppercase; }
    .chart-caption { color:var(--muted); font-size:.69vw; letter-spacing:.06em; }
    .gantt { --label-width:9.6vw; position:relative; border:1px solid var(--line); border-radius:.85vw; overflow:hidden; background:rgba(4,10,25,.74); box-shadow:0 1.2vw 3vw rgba(0,0,0,.28); }
    .axis-row,.office-row { display:grid; grid-template-columns:var(--label-width) 1fr; }
    .axis-label,.office-label { position:relative; z-index:4; border-right:1px solid var(--line); background:rgba(7,17,38,.98); }
    .axis-label { height:3.7vh; border-bottom:1px solid var(--line); }
    .axis-track { position:relative; height:3.7vh; border-bottom:1px solid var(--line); background:rgba(7,17,38,.84); overflow:hidden; }
    .axis-tick { position:absolute; top:0; bottom:0; border-left:1px solid rgba(249,249,249,.12); }

    .office-label { display:flex; flex-direction:column; justify-content:center; padding:0 .68vw; border-bottom:1px solid rgba(249,249,249,.09); }
    .office-label strong { font-size:.71vw; letter-spacing:.045em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .office-label small { margin-top:.1vw; color:var(--muted); font-size:.54vw; }
    .office-name-line { display:flex; align-items:center; gap:.42vw; }
    .office-dot { flex:none; width:.5vw; height:.5vw; border-radius:50%; box-shadow:0 0 .55vw currentColor; }
    .overflow-badge { display:inline-flex; align-items:center; justify-content:center; min-width:1.35vw; height:1.1vw; margin-left:auto; padding:0 .28vw; border-radius:999px; background:rgba(249,249,249,.13); color:#fff; font-size:.53vw; font-weight:900; }
    .office-track { position:relative; border-bottom:1px solid rgba(249,249,249,.09); overflow:hidden; background:rgba(2,7,20,.3); }
    .office-row:nth-child(odd) .office-track { background:rgba(16,31,63,.13); }
    .week-grid { position:absolute; inset:0; pointer-events:none; }
    .week-line { position:absolute; top:0; bottom:0; border-left:1px solid rgba(249,249,249,.065); }
    .now-rule { position:absolute; z-index:8; top:0; bottom:0; width:.12vw; background:#fff; box-shadow:0 0 .65vw rgba(103,217,255,.85); pointer-events:none; }
    .now-rule:before { content:"NOW"; position:absolute; top:.28vh; left:50%; transform:translateX(-50%); padding:.1vw .25vw; border-radius:.18vw; background:#fff; color:#041020; font-size:.49vw; font-weight:950; letter-spacing:.08em; }
    .chart-now:before { display:none; }
    .item-tie { position:absolute; z-index:1; width:1px; background:rgba(174,187,208,.22); pointer-events:none; }
    .gantt-bar { position:absolute; z-index:3; height:calc(var(--lane-height) - 6px); min-width:1.5vw; display:flex; align-items:center; padding:0 .48vw; border-radius:.32vw; overflow:hidden; cursor:pointer; font-size:clamp(11px,.69vw,15px); font-weight:800; line-height:1.08; letter-spacing:-.01em; transition:filter .13s,transform .13s,opacity .13s; }
    .gantt-bar:hover { z-index:7; filter:brightness(1.18); transform:translateY(-1px); }
    .gantt-bar.lead { color:#fff; border:1px solid var(--office); background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--office) 45%,transparent) 0,color-mix(in srgb,var(--office) 45%,transparent) .35vw,color-mix(in srgb,var(--office) 28%,transparent) .35vw,color-mix(in srgb,var(--office) 28%,transparent) .7vw); }
    .gantt-bar.lead.filed { background:var(--office); box-shadow:0 0 .75vw color-mix(in srgb,var(--office) 38%,transparent); }
    .gantt-bar.need { color:#fff; border:2px solid var(--office); background:rgba(4,7,20,.86); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
    .gantt-bar.need.filed { background:color-mix(in srgb,var(--office) 20%,rgba(4,7,20,.88)); }
    .gantt-bar.resolved { color:#d8dce4; border-color:#77808f; background:#4d5562; box-shadow:none; opacity:.58; }
    .gantt-bar.defaulted { color:#fff; border-color:var(--danger); background:#6b2633; opacity:.68; }
    .gantt-bar.selected { z-index:9; outline:2px solid #fff; outline-offset:2px; filter:brightness(1.15); }
    .gantt-bar span { display:-webkit-box; overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .empty-chart-note { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#78879f; font-size:.85vw; }
    .rail { min-width:0; position:relative; z-index:2; display:flex; flex-direction:column; gap:1.15vh; padding:2.1vh 1.15vw 2vh; border-left:1px solid var(--line); background:linear-gradient(180deg,rgba(9,21,47,.96),rgba(4,7,20,.98)); box-shadow:-1vw 0 3vw rgba(0,0,0,.22); }
    .room-clock { flex:none; padding:.7vw .8vw .75vw; border:1px solid rgba(103,217,255,.28); border-radius:.65vw; background:linear-gradient(135deg,rgba(0,99,229,.2),rgba(2,7,20,.55)); }
    .room-date { font-size:1.62vw; font-weight:670; letter-spacing:-.045em; line-height:1; }
    .close-signal { margin-top:.42vw; color:var(--cyan); font-size:.65vw; font-weight:800; }
    .close-meter { height:.28vw; margin-top:.47vw; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.09); }

    .room-dials { flex:none; display:grid; gap:.55vh; }

    .room-meter { height:.43vw; overflow:hidden; border-radius:999px; background:#020714; }
    .room-fill { height:100%; border-radius:inherit; box-shadow:0 0 .6vw currentColor; transition:width .2s,background .2s; }

    @media(max-aspect-ratio:4/3) { .room-shell{grid-template-columns:2.55fr 1fr}.gantt{--label-width:12vw}.office-label strong{font-size:.85vw}.gantt-bar{font-size:clamp(10px,.83vw,14px)} }
  </style>
</head>
<body>

  <script>
    'use strict';
    const STORAGE_KEY='disney-dais-console-v3';
    const HISTORY_KEY='disney-dais-console-history-v3';

    const DIAL_MIN=0,DIAL_MAX=20,MAX_HISTORY=50,DEFAULT_SIM_START='2026-09-01',LANE_HEIGHT_PX=38;

    const OFFICES=[
      {key:'damaro',name:"D'Amaro",aliases:['damaro',"d'amaro",'d’amaro','ceo'],color:'#20a4f3'},

    const IS_ROOM=new URLSearchParams(location.search).get('wall')==='1';
    let roomWindow=null,notice='',stagingErrors=[],selectedId=null;
    let undoStack=loadUndoStack(),state=loadState();
    function freshState(){return{version:3,dials:{cash:12,love:10,control:10},clock:{simStart:DEFAULT_SIM_START,paused:false,pauseScheduleElapsed:0,manualDelayMs:0},config:{...DEFAULT_CONFIG},items:[],staging:[],updatedAt:new Date().toISOString()};}
    function normalizeState(input){
      const base=freshState(),candidate=input&&input.state?input.state:input;if(!candidate||typeof candidate!=='object')throw new Error('Invalid save file.');

    function stageItem(item){return `<div class="stage-row"><div><strong>${escapeHtml(item.id)} · ${escapeHtml(item.title)}</strong><small>${escapeHtml(item.office)} · ${escapeHtml(formatSimDate(Date.parse(item.appears),{short:true}))} → ${escapeHtml(formatSimDate(Date.parse(item.due),{short:true}))}</small></div>${state.config.deadlineSource==='declared'?`<input class="stage-due" data-action="stage-due" data-id="${escapeHtml(item.id)}" type="datetime-local" value="${escapeHtml(toLocalInput(item.due))}">`:''}</div>`;}
    function itemVisibleInterval(item){const start=Date.parse(item.appears),printedEnd=Date.parse(item.due),resolvedEnd=item.resolvedSim?Date.parse(item.resolvedSim):printedEnd;return{start,end:item.resolved?Math.max(start,Math.min(printedEnd,resolvedEnd)):printedEnd};}
    function buildRowLayouts(chartItems){return OFFICES.map(office=>{const entries=chartItems.filter(item=>touchedOffices(item).includes(office.key)).map(item=>({...item,interval:itemVisibleInterval(item)})).sort((a,b)=>a.interval.start-b.interval.start||a.interval.end-b.interval.end),laneEnds=[],placements=[];entries.forEach(item=>{let lane=laneEnds.findIndex(end=>end<=item.interval.start);if(lane<0){lane=laneEnds.length;laneEnds.push(item.interval.end);}else laneEnds[lane]=item.interval.end;placements.push({item,lane});});const laneCount=Math.max(1,Math.min(state.config.laneCapPerOffice,laneEnds.length||1)),visible=placements.filter(entry=>entry.lane<state.config.laneCapPerOffice),hidden=placements.length-visible.length;return{office,visible,hidden,laneCount,height:laneCount*LANE_HEIGHT_PX};});}
    function renderRoom(){
      document.body.className='room';const clock=clockView(),past=state.config.windowPastMinutes*60000,future=state.config.windowFutureMinutes*60000,windowStart=clock.simMs-past,windowEnd=clock.simMs+future,total=windowEnd-windowStart,nowPct=past/total*100,chartItems=state.items.filter(item=>item.onChart&&itemVisibleInterval(item).end>=windowStart&&itemVisibleInterval(item).start<=windowEnd),rows=buildRowLayouts(chartItems),rowStarts=[];let cursor=0;rows.forEach(row=>{rowStarts.push(cursor);cursor+=row.height;});const ticks=[],firstTick=Math.ceil(windowStart/(7*86400000))*7*86400000;for(let tick=firstTick;tick<=windowEnd;tick+=7*86400000)ticks.push({ms:tick,pct:(tick-windowStart)/total*100});
      const ties=chartItems.map(item=>{const touched=touchedOffices(item),indices=touched.map(key=>OFFICES.findIndex(office=>office.key===key)).filter(index=>index>=0);if(indices.length<2)return'';const interval=itemVisibleInterval(item),mid=(Math.max(interval.start,windowStart)+Math.min(interval.end,windowEnd))/2,pct=(mid-windowStart)/total*100,top=rowStarts[Math.min(...indices)],bottom=rowStarts[Math.max(...indices)]+rows[Math.max(...indices)].height;return`<span class="item-tie" style="left:calc(var(--label-width) + (100% - var(--label-width)) * ${pct/100});top:${top}px;height:${bottom-top}px"></span>`;}).join('');
      document.getElementById('app').innerHTML=`<div class="room-shell"><section class="chart-side"><header class="chart-head"><div><div class="chart-brand">The Disney Machine</div><div class="chart-caption">Find your office. Watch the bar approach NOW.</div></div></header><div class="gantt"><div class="axis-row"><div class="axis-label"></div><div class="axis-track">${ticks.map(tick=>`<span class="axis-tick" style="left:${tick.pct}%"><span>${escapeHtml(formatSimDate(tick.ms,{short:true}))}</span></span>`).join('')}<span class="now-rule" style="left:${nowPct}%"></span></div></div><div style="position:relative">${rows.map(row=>roomRow(row,windowStart,total,ticks)).join('')}${ties}<span class="now-rule chart-now" style="left:calc(var(--label-width) + (100% - var(--label-width)) * ${nowPct/100});top:0"></span>${chartItems.length?'':'<div class="empty-chart-note">No items on the chart.</div>'}</div></div></section><aside class="rail"><section class="room-clock"><div class="room-date">${escapeHtml(clock.dateLabel)}</div><div class="close-signal">${escapeHtml(closeLabel(clock.closeRemaining))}</div><div class="close-meter"><div class="close-fill" style="width:${Math.max(0,Math.min(100,clock.closeProgress*100))}%"></div></div></section><section class="room-dials">${roomDial('Cash',state.dials.cash)}${roomDial('Love',state.dials.love)}${roomDial('Control',state.dials.control)}</section>${detailPane()}</aside></div>`;
    }
    function roomRow(row,windowStart,total,ticks){const office=row.office;return`<div class="office-row" style="height:${row.height}px"><div class="office-label" style="height:${row.height}px;border-left:.28vw solid ${office.color}"><div class="office-name-line"><span class="office-dot" style="color:${office.color};background:${office.color}"></span><strong>${escapeHtml(office.name)}</strong>${row.hidden?`<span class="overflow-badge">+${row.hidden}</span>`:''}</div><small>${row.visible.length?`${row.visible.length} visible`:'Clear'}</small></div><div class="office-track" style="height:${row.height}px;--lane-height:${LANE_HEIGHT_PX}px"><div class="week-grid">${ticks.map(tick=>`<span class="week-line" style="left:${tick.pct}%"></span>`).join('')}</div>${row.visible.map(entry=>roomBar(entry.item,entry.lane,office,windowStart,total)).join('')}</div></div>`;}
    function roomBar(item,lane,rowOffice,windowStart,total){const interval=itemVisibleInterval(item),left=Math.max(0,(interval.start-windowStart)/total*100),right=Math.min(100,(interval.end-windowStart)/total*100),width=Math.max(.8,right-left),lead=officeFor(item.office),role=rowOffice.key===lead.key?'lead':'need',classes=['gantt-bar',role,item.filed?'filed':'',item.resolved?'resolved':'',item.defaulted?'defaulted':'',selectedId===item.id?'selected':''].filter(Boolean).join(' ');return`<button class="${classes}" data-item-id="${escapeHtml(item.id)}" style="--office:${lead.color};left:${left}%;width:${width}%;top:${lane*LANE_HEIGHT_PX+3}px" title="${escapeHtml(item.title)}"><span>${escapeHtml(item.title)}</span></button>`;}
    function roomDial(label,value){const band=dialBand(value),width=value/20*100;return`<div class="room-dial"><div class="room-dial-top"><span class="room-dial-name">${label}</span><span class="room-dial-value">${value}</span></div><div class="room-meter"><div class="room-fill" data-band="${band.key}" style="width:${width}%;background:${band.color};color:${band.color}"></div></div></div>`;}
    function detailPane(){const item=state.items.find(entry=>entry.id===selectedId&&entry.onChart);if(!item)return`<section class="detail-pane"><div class="detail-empty">Select any solid or hollow bar to read the item.</div></section>`;const lead=officeFor(item.office),needs=splitNeeds(item.needs);return`<section class="detail-pane" style="--office:${lead.color}"><div class="detail-lead"><span class="office-dot" style="color:${lead.color};background:${lead.color}"></span>${escapeHtml(item.office)}</div><h1>${escapeHtml(item.title)}</h1><p class="detail-situation">${escapeHtml(item.situation)}</p>${detailBlock('Decide',item.decide)}${detailBlock('Needs',needs.length?needs.join(', '):'None')}${detailBlock('The key number',item.number||'—')}${detailBlock('The outside name',item.outside||'—')}<div class="detail-block"><div class="detail-label">If nobody files</div><div class="detail-value">${escapeHtml(item.if_nobody)}</div>${dialEffectChips(item)}</div></section>`;}
    function dialEffectChips(item){const chips=['cash','love','control'].filter(key=>item.dialEffects[key]).map(key=>{const band=dialBand(state.dials[key]);return`<span class="default-chip" style="color:${band.color}">${escapeHtml(key)} ${escapeHtml(signed(item.dialEffects[key]))}</span>`;});return chips.length?chips.join(' '):'<span class="default-chip" style="color:#aebbd0">No dial movement</span>';}
    function detailBlock(label,value){return`<div class="detail-block"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value">${escapeHtml(value)}</div></div>`;}
    function render(){if(IS_ROOM)renderRoom();else renderControl();}
    function updateControlClock(){const clock=clockView(),values={'control-clock-date':clock.dateLabel,'control-clock-close':closeLabel(clock.closeRemaining),'control-clock-state':clock.status};Object.entries(values).forEach(([id,value])=>{const element=document.getElementById(id);if(element)element.textContent=value;});}
    function openRoom(){const url=new URL(location.href);url.searchParams.set('wall','1');roomWindow=window.open(url.toString(),'disney-dais-room');if(!roomWindow)notice='Chrome blocked the room window. Allow pop-ups, then try again.';renderControl();}
    function exportJson(){const payload={version:3,exportedAt:new Date().toISOString(),state:snapshot()},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=`disney-dais-${new Date().toISOString().slice(0,10)}.json`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    async function importJson(file){try{const imported=normalizeState(JSON.parse(await file.text()));if(!confirm(`Import ${imported.items.length} accepted items and ${imported.staging.length} staged items?`))return;undoStack.push(snapshot());state=imported;persist();notice='Save imported.';render();}catch(error){notice=`Import failed: ${error.message}`;render();}}
    document.getElementById('app').addEventListener('click',event=>{if(IS_ROOM){const bar=event.target.closest('[data-item-id]');if(bar){event.stopPropagation();selectedId=selectedId===bar.dataset.itemId?null:bar.dataset.itemId;renderRoom();}else{selectedId=null;renderRoom();}return;}const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='open-room')openRoom();else if(action==='toggle-clock')toggleClock();else if(action==='undo')undo();else if(action==='export')exportJson();else if(action==='import-trigger')document.getElementById('import-file').click();else if(action==='nudge'){const key=button.dataset.dial,amount=Number(button.dataset.amount);commit(current=>current.dials[key]=clampInt(current.dials[key]+amount,0,20,current.dials[key]));}else if(action==='validate-csv')addCsvToStaging();else if(action==='stage-quick')addQuickToStaging();else if(action==='accept-staging')acceptStaging();else if(action==='reject-staging')rejectStaging();else if(action==='push')pushItem(button.dataset.id);else if(action==='filed')markFiled(button.dataset.id);else if(action==='resolved')markResolved(button.dataset.id);});
    document.getElementById('app').addEventListener('change',event=>{if(IS_ROOM)return;const target=event.target,action=target.dataset.action;if(action==='config'){const key=target.dataset.key,value=key==='deadlineSource'?target.value:clampInt(target.value,1,key==='laneCapPerOffice'?12:525600,state.config[key]);commit(current=>current.config[key]=value);}else if(action==='stage-due'){try{const due=fromLocalInput(target.value);commit(current=>{const item=current.staging.find(entry=>entry.id===target.dataset.id);if(item&&Date.parse(due)>Date.parse(item.appears))item.due=due;});}catch(error){notice='Choose a valid deadline after the item appears.';render();}}else if(target.id==='import-file'&&target.files&&target.files[0])importJson(target.files[0]);});
    window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){try{state=normalizeState(JSON.parse(event.newValue));render();}catch(error){}}});
    window.addEventListener('beforeunload',()=>{if(!IS_ROOM)persist();});
    setInterval(()=>{if(IS_ROOM){renderRoom();return;}const changed=processDefaults();if(!changed)updateControlClock();const status=document.getElementById('wall-status');if(status){const open=roomWindow&&!roomWindow.closed;status.textContent=open?'Room open':'Room closed';status.classList.toggle('open',Boolean(open));}},1000);
    render();
  </script>
</body>
